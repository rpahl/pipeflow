name: CI
on: [push]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  TZ: UTC
  LANG: C.UTF-8
  R_KEEP_PKG_SOURCE: yes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  lint:
    name: Lint (lintr)
    # Not ubuntu-latest: renv.lock pins the P3M binaries for Ubuntu 24.04
    # (noble), which don't load on newer Ubuntu releases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # if uploading SARIF

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # The formatting, including the indentation, is checked by air, not lintr
      # (lintr's indentation_linter takes minutes on the large test files)
      - uses: posit-dev/setup-air@482cb5912394878ab5a63b75db0f9d19cc6df5ba  # v1
        with:
          version: "0.13.0"

      - name: Check formatting (air)
        run: air format --check .

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.9
        with:
          r-version: renv          # R version from renv.lock
          use-public-rspm: true

      # If not available, install renv itself (small, from CRAN)
      - name: Install renv
        shell: Rscript {0}
        run: |
          hasRenv <- requireNamespace("renv")
          if (!hasRenv) {
            install.packages("renv")
          }

      # Restore *only* lintr (and its deps) at the versions from renv.lock
      - name: Restore lintr from renv.lock
        shell: Rscript {0}
        run: |
          renv::restore(packages = "lintr", prompt = FALSE, clean = FALSE)

      - name: Lint
        shell: Rscript {0}
        run: |
          l <- lintr::lint_package()
          if (length(l)) print(l)
          if (length(l) > 0) quit("no", 1)

    # Optional SARIF upload, kept as-is but commented out in your file
    # - name: Lint (SARIF)
    #   shell: Rscript {0}
    #   run: |
    #     l <- lintr::lint_package()
    #     lintr::write_sarif(l, "lintr.sarif")
    # - uses: github/codeql-action/upload-sarif@v3
    #   if: always()
    #   with:
    #     sarif_file: lintr.sarif

  check:
    name: R CMD check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read           # private repos need this
      checks: write            # required to create/update check runs
      pull-requests: write
      issues: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true

      - uses: ./.github/actions/r-check-env

      - name: R CMD check with renv-pinned deps
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual"),
            error_on = "warning",
            check_dir = "check"
          )
        env:
          _R_CHECK_LIMIT_CORES_: FALSE   # allow more than 2 cores

      - name: R CMD check against current CRAN
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.9
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
        env:
          _R_CHECK_LIMIT_CORES_: FALSE   # allow more than 2 cores

      - name: Publish Linux Test Results
        if: always() && startsWith(matrix.os, 'ubuntu') && hashFiles('check/*.Rcheck/tests/testthat/*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d  # v2.9
        with:
          files: check/*.Rcheck/tests/testthat/*.xml
          deduplicate_classes_by_file_name: true

      - name: Upload R CMD check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: r-cmd-check-${{ matrix.os }}
          path: check

  check-oldest-r:
    name: R CMD check (R 4.2, oldest supported)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2

      # renv.lock pins R 4.5.3, so this job installs the newest package
      # versions that work with R 4.2 from DESCRIPTION instead.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          r-version: '4.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.9
        with:
          build_args: 'c("--no-manual")'
          error-on: '"warning"'
        env:
          _R_CHECK_LIMIT_CORES_: FALSE   # allow more than 2 cores
