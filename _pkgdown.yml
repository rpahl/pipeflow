url: https://github.com/rpahl/pipeflow


build:
  exclude:
  - "LICENSE"
  - "instructions.md"

template:
  bootstrap: 5
  bootswatch: united

authors:
  Roman Pahl:
    href: https://rpahl.github.io/r-some-blog/about.html

home:
  links:
  - text: Visit my R blog
    href: https://rpahl.github.io/r-some-blog/
  - text: Visit my R packages universe
    href: https://rpahl.r-universe.dev/packages/


reference:
- title: "Getting started"
  desc: Create a pipeline, add steps, and collect results.
  contents:
  - pipeflow-package
  - pip_new
  - pip_add
  - pip_collect

- title: "Modify steps"
  desc: Replace, rename, remove, reset, or re-configure steps.
  contents:
  - pip_replace
  - pip_rename
  - pip_remove
  - pip_reset
  - pip_set_params

- title: "Pipeline composition"
  desc: Combine or clone pipelines.
  contents:
  - rbind.pipeflow
  - pip_clone

- title: "Running pipelines"
  desc: Execute pipelines and control runs dynamically from within steps.
  contents:
  - pip_run

- title: "Locking and tagging"
  desc: Lock steps against changes or tag them for filtering.
  contents:
  - pip_lock
  - pip_tag

- title: "Inspection and views"
  desc: Inspect the pipeline structure, access the step table, and create filtered views.
  contents:
  - pip_view
  - pip_data
  - pip_graph

- title: "Extract and replace operators"
  desc: Subset, read from and write to a pipeline using base R operators.
  contents:
  - Extract.pipeflow

- title: "S3 methods"
  desc: Generic methods for pipeflow objects.
  contents:
  - dim.pipeflow
  - print.pipeflow

- title: "Filtering helpers"
  desc: Filter operators from data.table re-exported for use in view and subset expressions.
  contents:
  - pipeflow-operators



news:
  releases:
  - text: "Version 0.2.2"
    href: https://rpahl.github.io/r-some-blog/posts/2024-12-21-introducing-pipeflow/

